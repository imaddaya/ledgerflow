spring:
  application:
    name: ledgerflow
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  demo-seed: ${DEMO_SEED:true}
  demo-password: ${DEMO_PASSWORD:DemoPass123!}
springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi
